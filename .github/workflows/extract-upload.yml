name: Extract uploaded project ZIP
on:
  push:
    paths:
      - .github/workflows/extract-upload.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract project files to repository root
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          archive = pathlib.Path("tiktok-live-interactive-game-main.zip")
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  path = pathlib.PurePosixPath(info.filename)
                  if not path.parts or path.parts[0] != "tiktok-live-interactive-game-main":
                      raise ValueError("Unexpected archive entry")
                  relative = pathlib.Path(*path.parts[1:])
                  if not relative.parts or '..' in relative.parts:
                      raise ValueError("Unsafe archive path")
                  target = pathlib.Path(".") / relative
                  if target.exists() and target.name == "README.md":
                      target = pathlib.Path("PROJECT_README.md")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          PY
          rm .github/workflows/extract-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract TikTok live interactive game project" || exit 0
          git push
